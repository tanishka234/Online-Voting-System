{% extends "base.html" %}

{% block content %}
<div class="auth-form">
    <h2 class="text-center">Create Account</h2>
    <p class="text-center">Register to access the voting system</p>
    
    <form method="POST" action="{{ url_for('register') }}" onsubmit="return validateRegistration()">
        <div class="form-group">
            <label for="name"><i class="fas fa-user"></i> Full Name</label>
            <input type="text" id="name" name="name" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="password"><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
            <small class="form-text">Minimum 8 characters with uppercase, lowercase, and numbers</small>
        </div>
        
        <div class="form-group">
            <label for="confirm_password"><i class="fas fa-lock"></i> Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
        </div>
        
        <div class="form-group">
            <div class="form-check">
                <input type="checkbox" id="terms" class="form-check-input" required>
                <label for="terms" class="form-check-label">
                    I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                </label>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Register</button>
        
        <div class="text-center mt-3">
            <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
        </div>
    </form>
</div>

<script>
function validateRegistration() {
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirm_password');
    const name = document.getElementById('name');
    
    // Name validation
    if (name.value.trim().length < 3) {
        alert('Name must be at least 3 characters long');
        return false;
    }
    
    // Password validation
    const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
    if (!passwordRegex.test(password.value)) {
        alert('Password must be at least 8 characters with uppercase, lowercase, and numbers');
        return false;
    }
    
    // Confirm password
    if (password.value !== confirmPassword.value) {
        alert('Passwords do not match');
        return false;
    }
    
    return true;
}
</script>
{% endblock %}
